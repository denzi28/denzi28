<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pulse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d0c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234cd38a' stroke-width='4' stroke-dasharray='40 60' stroke-linecap='round' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d0c;
  --surface: #141816;
  --surface-2: #1c211e;
  --surface-3: #262c28;
  --line: #262c28;
  --ink: #eef1ec;
  --ink-2: #b4bcb6;
  --muted: #7f8983;
  --rec-green: #4cd38a;
  --rec-yellow: #f2c94c;
  --rec-red: #ef5a4f;
  --strain: #4aa3ff;
  --sleep: #9b8cff;
  --deep: #4a6fd6; --light: #7aa7e8; --rem: #b48cf0; --awake: #e8956b;
  --z1: #3a4a42; --z2: #4aa3ff; --z3: #4cd38a; --z4: #f2c94c; --z5: #ef5a4f;
  --radius: 18px;
  --num: "Barlow Semi Condensed", Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
.num { font-family: var(--num); letter-spacing: -.01em; }
[hidden] { display: none !important; }

/* shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 24px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--num); font-weight: 700; font-size: 22px; letter-spacing: .06em; padding: 0 10px 22px; }
.nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted); font-weight: 500; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.nav-btn:hover { color: var(--ink); }
main { padding: 20px 24px 120px; max-width: 980px; width: 100%; margin: 0 auto; }
.tabbar { display: none; }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  main { padding: calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(11,13,12,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); }
  .tabbar .nav-btn { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 2px; justify-content: center; background: none !important; }
  .tabbar .nav-btn[aria-current="page"] { color: var(--ink); }
  .tabbar .nav-btn[aria-current="page"] svg { color: var(--rec-green); }
}

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.daynav { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.daynav button { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-2); }
.daynav button:disabled { opacity: .3; cursor: default; }
.daynav button:not(:disabled):hover { background: var(--surface-2); }
.daynav .label { min-width: 118px; text-align: center; font-weight: 600; font-size: 14px; }
.avatar { width: 38px; height: 38px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.demo-pill { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--rec-yellow); border: 1px solid rgba(242,201,76,.35); border-radius: 999px; padding: 3px 8px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card + .card, .stack > * + * { margin-top: 12px; }
.card-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 10px; }
.card-title h3 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.card-title span { font-size: 12px; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.cols > .stack > * + * { margin-top: 12px; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* dials */
.dials { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 18px 10px 14px; }
.dial { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.dial button { display: contents; }
.dial svg { width: 100%; max-width: 150px; height: auto; overflow: visible; }
.dial .cap { margin-top: 6px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.dial .sub { font-size: 11px; color: var(--muted); }
.dial-val { font-family: var(--num); font-weight: 700; fill: var(--ink); }
.dial-unit { font-size: 11px; fill: var(--muted); font-family: Inter, sans-serif; }

/* coach */
.coach { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.coach .badge { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; }
.coach h4 { margin: 0 0 2px; font-size: 16px; }
.coach p { margin: 0; color: var(--ink-2); font-size: 14px; }
.target { margin-top: 14px; }
.target-bar { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); margin: 8px 0 4px; }
.target-bar .zone { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: rgba(74,163,255,.35); border: 1px solid var(--strain); }
.target-bar .now { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.target-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

/* metric grid */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 900px) { .metrics.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
.metric .k { font-size: 12px; color: var(--muted); font-weight: 500; }
.metric .v { font-family: var(--num); font-size: 30px; font-weight: 600; line-height: 1.1; margin-top: 2px; }
.metric .v small { font-family: Inter, sans-serif; font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.metric .d { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
.metric .spark { height: 28px; margin-top: 6px; }
.up-good { color: var(--rec-green); } .down-bad { color: var(--rec-red); } .flat { color: var(--muted); }

/* lists */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; }
.row .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 12px; color: var(--muted); }
.row .strain-chip { font-family: var(--num); font-weight: 700; font-size: 20px; color: var(--strain); text-align: right; }
.row .strain-chip small { display: block; font-family: Inter, sans-serif; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: .06em; }
.empty { color: var(--muted); font-size: 13px; padding: 14px 0; text-align: center; }

/* charts */
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.axis text { fill: var(--muted); font-size: 10.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: #f4f6f2; color: #111; padding: 8px 10px; border-radius: 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 8px 28px rgba(0,0,0,.45); max-width: 240px; }
#tip .r { display: flex; align-items: center; gap: 6px; }
#tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* segmented */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }

/* sleep stages */
.stages { display: flex; height: 18px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 10px 0; }
.stage-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stage-list div { font-size: 12px; color: var(--muted); }
.stage-list b { display: block; font-family: var(--num); font-size: 20px; color: var(--ink); font-weight: 600; }
.stage-list i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.big-stat { display: flex; align-items: center; gap: 18px; }
.big-stat .dial { width: 130px; flex: none; }
.big-stat .facts { display: grid; gap: 8px; flex: 1; }
.fact-line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.fact-line:last-child { border-bottom: 0; }
.fact-line span { color: var(--muted); }
.fact-line b { font-weight: 600; }

/* zones */
.zone-row { display: grid; grid-template-columns: 54px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 12px; margin: 6px 0; }
.zone-row .bar { height: 10px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.zone-row .bar div { height: 100%; border-radius: 999px; }
.zone-row .v { text-align: right; color: var(--ink-2); }

/* profile */
.profile-head { display: flex; align-items: center; gap: 14px; }
.profile-head .avatar { width: 56px; height: 56px; font-size: 20px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.setting:last-child { border-bottom: 0; }
.setting span { color: var(--muted); font-size: 13px; }
.pill-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; }
.pill-btn.primary { background: var(--rec-green); color: #08130d; border-color: transparent; font-weight: 600; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: var(--rec-green); margin-right: 6px; }
.disclaimer { font-size: 11.5px; color: var(--muted); margin-top: 18px; line-height: 1.5; }

/* login */
.center { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login { width: min(380px, 100%); text-align: center; }
.login input { width: 100%; font: inherit; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); margin: 14px 0 10px; }
.login .err { color: var(--rec-red); font-size: 13px; min-height: 18px; }

.view { animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="tip" hidden></div>

<div id="login" class="center" hidden>
  <form class="card login" id="login-form">
    <svg viewBox="0 0 60 60" width="60" height="60" aria-hidden="true"><circle cx="30" cy="30" r="22" fill="none" stroke="var(--surface-3)" stroke-width="7"/><circle cx="30" cy="30" r="22" fill="none" stroke="var(--rec-green)" stroke-width="7" stroke-linecap="round" stroke-dasharray="95 200" transform="rotate(-90 30 30)"/></svg>
    <h1 class="num" style="margin:8px 0 0;font-size:30px;letter-spacing:.06em">PULSE</h1>
    <p class="muted" style="margin:4px 0 0">Garmin verilerinle toparlanma, yüklenme ve uyku.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Şifre" aria-label="Şifre" required>
    <div class="err" id="login-err"></div>
    <button class="pill-btn primary" style="width:100%;padding:12px" type="submit">Giriş yap</button>
  </form>
</div>

<div id="app" class="shell" hidden>
  <nav class="side" aria-label="Menü">
    <div class="logo"><svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><circle cx="14" cy="14" r="10" fill="none" stroke="var(--surface-3)" stroke-width="4"/><circle cx="14" cy="14" r="10" fill="none" stroke="var(--rec-green)" stroke-width="4" stroke-linecap="round" stroke-dasharray="44 70" transform="rotate(-90 14 14)"/></svg>PULSE</div>
    <div id="side-nav"></div>
  </nav>
  <main>
    <div class="top">
      <div class="daynav" id="daynav">
        <button id="prev-day" aria-label="Önceki gün"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="label" id="day-label">Bugün</div>
        <button id="next-day" aria-label="Sonraki gün"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="demo-pill" id="demo-pill" hidden>Demo</span>
        <button class="avatar" id="avatar" aria-label="Profil">R</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
  <nav class="tabbar" id="tab-nav" aria-label="Menü"></nav>
</div>

<script>
// ===================== settings =====================
const GOAL = { label: '5K 27:00 altı', seconds: 27 * 60 };
const DEMO = location.pathname.replace(/\/$/, '').endsWith('/demo') || new URLSearchParams(location.search).has('demo');

// ===================== helpers =====================
const DAY = 86400e3;
const $ = (s) => document.querySelector(s);
const SVG = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent) { const e = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round = (v, dp = 0) => (v == null || !isFinite(v) ? null : Math.round(v * 10 ** dp) / 10 ** dp);
const avg = (a) => { const v = a.filter((x) => x != null && isFinite(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const sd = (a) => { const m = avg(a); const v = a.filter((x) => x != null && isFinite(x)); return v.length > 2 ? Math.sqrt(avg(v.map((x) => (x - m) ** 2))) : null; };
const sum = (a) => a.reduce((s, x) => s + (x || 0), 0);
const dayKey = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const parseDay = (s) => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const parseLocal = (s) => new Date(s.replace(' ', 'T')).getTime();
const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const weekStart = (t) => { const d = new Date(startOfDay(t)); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const AY = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const GUN = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const fmtShort = (t) => { const d = new Date(t); return `${d.getDate()} ${AY[d.getMonth()]}`; };
const fmtDay = (t) => { const d = new Date(t); return `${GUN[d.getDay()]}, ${d.getDate()} ${AY[d.getMonth()]}`; };
const fmtClock = (sec) => { if (sec == null || !isFinite(sec)) return '–'; sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`; };
const fmtHM = (sec) => { if (sec == null) return '–'; const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return `${h}:${String(m).padStart(2, '0')}`; };
const fmtHours = (sec) => { if (!sec) return '0 dk'; const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return h ? `${h} sa ${m} dk` : `${m} dk`; };
const fmtPace = (s) => (s ? `${fmtClock(s)} /km` : '–');
const isRun = (a) => /run/.test(a.type || '');
function tryStore(fn) { try { return fn(); } catch { return null; } }

// ===================== tooltip =====================
const tip = $('#tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (left < 8) left = 8;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = `${left}px`; tip.style.top = `${top}px`;
}
const hideTip = () => { tip.hidden = true; };
addEventListener('scroll', hideTip, { passive: true });
const tipRow = (c, l, v) => `<div class="r">${c ? `<i style="background:${c}"></i>` : ''}${esc(l)}: <b>${esc(v)}</b></div>`;
function hover(node, html) {
  const show = (ev) => showTip(html, ev.clientX, ev.clientY);
  node.addEventListener('pointermove', show); node.addEventListener('pointerdown', show); node.addEventListener('pointerleave', hideTip);
}

// ===================== scores (our own estimates) =====================
// Recovery: last night's HRV and resting HR against your own 30-day normal, plus sleep.
// Strain: Garmin training load + daily movement, squashed onto 0–21.
// Sleep performance: hours asleep vs. what you needed (base + yesterday's strain + recent debt).
const STRAIN_K = 260;
function strainFromLoad(load, steps) { return round(21 * (1 - Math.exp(-((load || 0) + ((steps || 0) / 10000) * 20) / STRAIN_K)), 1); }
const recColor = (r) => (r == null ? css('--muted') : r >= 67 ? css('--rec-green') : r >= 34 ? css('--rec-yellow') : css('--rec-red'));
const recWord = (r) => (r >= 67 ? 'Yeşil' : r >= 34 ? 'Sarı' : 'Kırmızı');

function buildModel(D) {
  const acts = (D.activities || []).map((a) => ({ ...a, t: parseLocal(a.start) })).sort((a, b) => a.t - b.t);
  const daily = D.daily || {}, sleep = D.sleep || {}, hrv = D.hrv || {};
  const keys = [...new Set([...Object.keys(daily), ...Object.keys(sleep), ...Object.keys(hrv), ...acts.map((a) => dayKey(a.t))])].sort();
  const actsByDay = new Map();
  for (const a of acts) { const k = dayKey(a.t); if (!actsByDay.has(k)) actsByDay.set(k, []); actsByDay.get(k).push(a); }
  const days = keys.map((k) => {
    const s = sleep[k] || null, h = hrv[k] || null, d = daily[k] || {};
    const list = actsByDay.get(k) || [];
    const load = sum(list.map((a) => a.load));
    return { key: k, t: parseDay(k), acts: list, d, sleep: s, hrv: h, load, strain: strainFromLoad(load, d.steps) };
  });
  days.forEach((day, i) => {
    const prev = days.slice(Math.max(0, i - 30), i);
    const hrvBase = prev.map((p) => p.hrv?.last), rhrBase = prev.map((p) => p.d.rhr);
    const yesterday = days[i - 1];
    // sleep need: 7.5 h, +3 min per strain point above 10 yesterday, +30% of the last 3 nights' debt
    const debt = sum(days.slice(Math.max(0, i - 3), i).map((p) => (p.sleep && p.sleepNeed ? Math.max(0, p.sleepNeed - p.asleep) : 0))) / 3;
    day.sleepNeed = 7.5 * 3600 + Math.max(0, (yesterday?.strain || 0) - 10) * 180 + 0.3 * debt;
    day.asleep = day.sleep ? (day.sleep.deep || 0) + (day.sleep.light || 0) + (day.sleep.rem || 0) || day.sleep.total : null;
    day.sleepPerf = day.asleep ? clamp(Math.round((day.asleep / day.sleepNeed) * 100), 1, 100) : null;
    day.hrvBase = avg(hrvBase); day.rhrBase = avg(rhrBase);
    const hz = day.hrv?.last && day.hrvBase ? (day.hrv.last - day.hrvBase) / (sd(hrvBase) || day.hrvBase * 0.12) : null;
    const rz = day.d.rhr && day.rhrBase ? (day.rhrBase - day.d.rhr) / (sd(rhrBase) || 2.5) : null;
    const pz = day.sleepPerf != null ? (day.sleepPerf - 85) / 10 : null;
    const parts = [[hz, 0.55], [rz, 0.25], [pz, 0.2]].filter(([v]) => v != null);
    if (parts.length && (hz != null || rz != null)) {
      const w = sum(parts.map((p) => p[1]));
      const score = sum(parts.map(([v, wt]) => clamp(v, -3, 3) * wt)) / w;
      day.recovery = clamp(Math.round(100 / (1 + Math.exp(-(1.25 * score + 0.35)))), 1, 99);
    } else day.recovery = null;
  });
  return { days, acts, byKey: new Map(days.map((d) => [d.key, d])), fitnessAge: D.fitnessAge, summary: D.summary || {} };
}

function coachFor(day) {
  const r = day.recovery;
  const goalPace = GOAL.seconds / 5;
  if (r == null) return { icon: '•', color: css('--muted'), title: 'Veri bekleniyor', text: 'Bu gece saatini takarak uyursan sabah toparlanma skorun hazır olur.', range: [8, 14] };
  if (r >= 67) return { icon: '↑', color: css('--rec-green'), title: 'Yüklenmeye hazırsın', text: `Hedefin için kaliteli antrenman günü: 5 × 1 km, ${fmtClock(goalPace - 12)}–${fmtClock(goalPace - 6)} /km, aralarda 2 dk yavaş koşu.`, range: [14, 18] };
  if (r >= 34) return { icon: '→', color: css('--rec-yellow'), title: 'Dengeli bir gün', text: `Rahat tempoda 30–40 dk koşu (${fmtClock(goalPace + 50)} /km ve üstü). Sohbet edebileceğin hız.`, range: [10, 14] };
  return { icon: '↓', color: css('--rec-red'), title: 'Bugün toparlan', text: 'Dinlen ya da 20–30 dk yürüyüş, esneme. Erken yat; yarın daha iyi bir gün olur.', range: [0, 10] };
}

// ===================== chart primitives =====================
function ring(size, value, max, color, { center, unit, thick = 10, track } = {}) {
  const r = (size - thick) / 2, c = 2 * Math.PI * r, frac = value == null ? 0 : clamp(value / max, 0, 1);
  const svg = el('svg', { viewBox: `0 0 ${size} ${size}`, role: 'img' });
  el('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: track || css('--surface-3'), 'stroke-width': thick }, svg);
  const arc = el('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: color, 'stroke-width': thick, 'stroke-linecap': 'round', 'stroke-dasharray': `${c * frac} ${c}`, transform: `rotate(-90 ${size / 2} ${size / 2})` }, svg);
  arc.style.transition = 'stroke-dasharray .6s ease';
  const t = el('text', { x: size / 2, y: size / 2 + (unit ? 4 : 10), 'text-anchor': 'middle', class: 'dial-val', 'font-size': size * 0.27 }, svg);
  t.textContent = center ?? (value == null ? '–' : value);
  if (unit) { const u = el('text', { x: size / 2, y: size / 2 + size * 0.2, 'text-anchor': 'middle', class: 'dial-unit' }, svg); u.textContent = unit; }
  return svg;
}

function niceTicks(lo, hi, n = 3) {
  const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0) || mag * 10;
  const out = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * 1e-3; v += step) out.push(round(v, 6));
  if (out[out.length - 1] < hi) out.push(round(out[out.length - 1] + step, 6));
  return out;
}
const topRound = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h)); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };

// bars: [{ label, value, color, tip, selected }]
function bars(node, items, { height = 150, max, yTick = String, refs = [], onPick } = {}) {
  node.innerHTML = '';
  if (!items.length) { node.innerHTML = '<div class="empty">Bu aralıkta veri yok.</div>'; return; }
  const W = Math.max(240, node.clientWidth || 320), H = height, m = { l: 30, r: 6, t: 8, b: 22 };
  const top = max ?? Math.max(...items.map((b) => b.value || 0), ...refs.map((r) => r.y), 1);
  const ticks = niceTicks(0, top, 3), y1 = max ?? ticks[ticks.length - 1];
  const Y = (v) => m.t + (1 - v / y1) * (H - m.t - m.b);
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H });
  const g = el('g', { class: 'axis' }, svg);
  for (const v of ticks.filter((v) => v <= y1)) { el('line', { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: css('--line') }, g); const t = el('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }, g); t.textContent = yTick(v); }
  const band = (W - m.l - m.r) / items.length, bw = Math.max(3, Math.min(26, band * 0.66));
  const every = Math.ceil(items.length / Math.max(3, Math.floor((W - m.l) / 44)));
  items.forEach((b, i) => {
    const x = m.l + band * i + (band - bw) / 2;
    if (b.value != null && b.value > 0) {
      const y = Y(Math.min(b.value, y1));
      el('path', { d: topRound(x, y, bw, Y(0) - y, 4), fill: b.color, opacity: b.dim ? 0.45 : 1 }, svg);
    }
    if (b.selected) el('rect', { x: x - 3, y: m.t - 2, width: bw + 6, height: H - m.t - m.b + 2, rx: 6, fill: 'none', stroke: css('--ink-2'), 'stroke-width': 1 }, svg);
    if ((items.length - 1 - i) % every === 0) { const t = el('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle', class: 'axis', fill: css('--muted'), 'font-size': 10.5 }, svg); t.textContent = b.label; }
    const hit = el('rect', { x: m.l + band * i, y: 0, width: band, height: H, fill: 'transparent' }, svg);
    hover(hit, b.tip);
    if (onPick && b.key) hit.addEventListener('click', () => onPick(b.key));
  });
  for (const r of refs) { el('line', { x1: m.l, x2: W - m.r, y1: Y(r.y), y2: Y(r.y), stroke: css('--ink-2'), 'stroke-dasharray': '4 4', 'pointer-events': 'none' }, svg); if (r.label) { const t = el('text', { x: W - m.r, y: Y(r.y) - 4, 'text-anchor': 'end', fill: css('--muted'), 'font-size': 10.5 }, svg); t.textContent = r.label; } }
  node.appendChild(svg);
}

// line over time with crosshair. series: [{ name, color, data: [[t, v]], dots, faint }]
function line(node, series, { height = 150, yFmt = String, band, spark = false, refs = [] } = {}) {
  node.innerHTML = '';
  const all = series.flatMap((s) => s.data);
  if (!all.length) { node.innerHTML = spark ? '' : '<div class="empty">Bu aralıkta veri yok.</div>'; return; }
  const W = Math.max(spark ? 80 : 240, node.clientWidth || 300), H = spark ? 28 : height;
  const m = spark ? { l: 1, r: 1, t: 3, b: 3 } : { l: 30, r: 8, t: 8, b: 22 };
  const xs = all.map((d) => d[0]); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= DAY; x1 += DAY; }
  const ys = all.map((d) => d[1]).concat((band || []).flatMap((b) => [b[1], b[2]]), refs.map((r) => r.y));
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.12 || 1; y0 -= pad; y1 += pad;
  let ticks = []; if (!spark) { ticks = niceTicks(y0, y1, 3); y0 = ticks[0]; y1 = ticks[ticks.length - 1]; }
  const X = (t) => m.l + ((t - x0) / (x1 - x0)) * (W - m.l - m.r), Y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H });
  if (!spark) {
    const g = el('g', { class: 'axis' }, svg);
    for (const v of ticks) { el('line', { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: css('--line') }, g); const t = el('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }, g); t.textContent = v; }
    const n = Math.max(2, Math.min(5, Math.floor(W / 90)));
    for (let i = 0; i <= n; i++) { const t = x0 + ((x1 - x0) * i) / n; const tx = el('text', { x: X(t), y: H - 5, 'text-anchor': i === 0 ? 'start' : i === n ? 'end' : 'middle' }, g); tx.textContent = fmtShort(t); }
  }
  if (band && band.length) el('path', { d: `M${band.map((p) => `${X(p[0])},${Y(p[2])}`).join('L')}L${band.slice().reverse().map((p) => `${X(p[0])},${Y(p[1])}`).join('L')}Z`, fill: css('--rec-green'), opacity: 0.1 }, svg);
  for (const r of refs) el('line', { x1: m.l, x2: W - m.r, y1: Y(r.y), y2: Y(r.y), stroke: css('--ink-2'), 'stroke-dasharray': '4 4' }, svg);
  for (const s of series) {
    if (s.dots) for (const [t, v] of s.data) el('circle', { cx: X(t), cy: Y(v), r: 2.3, fill: s.color, opacity: s.faint ? 0.4 : 1 }, svg);
    if (!s.dots || s.line) { let d = '', prev = null; for (const [t, v] of s.data) { d += `${prev == null || t - prev > 4 * DAY ? 'M' : 'L'}${X(t).toFixed(1)},${Y(v).toFixed(1)}`; prev = t; } el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': spark ? 1.6 : 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg); }
  }
  const maps = series.map((s) => new Map(s.data.map((d) => [d[0], d[1]])));
  const ts = [...new Set(xs)].sort((a, b) => a - b);
  const cross = el('line', { y1: m.t, y2: H - m.b, stroke: css('--muted'), visibility: 'hidden' }, svg);
  const dots = series.map((s) => el('circle', { r: 4, fill: s.color, stroke: css('--surface'), 'stroke-width': 2, visibility: 'hidden' }, svg));
  const hit = el('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' }, svg);
  const move = (ev) => {
    const rect = svg.getBoundingClientRect(), px = ((ev.clientX - rect.left) / rect.width) * W, tx = x0 + ((px - m.l) / (W - m.l - m.r)) * (x1 - x0);
    let t = ts[0]; for (const c of ts) if (Math.abs(c - tx) < Math.abs(t - tx)) t = c;
    cross.setAttribute('x1', X(t)); cross.setAttribute('x2', X(t)); cross.setAttribute('visibility', 'visible');
    let rows = '';
    series.forEach((s, i) => { const v = maps[i].get(t); if (v == null) { dots[i].setAttribute('visibility', 'hidden'); return; } dots[i].setAttribute('cx', X(t)); dots[i].setAttribute('cy', Y(v)); dots[i].setAttribute('visibility', 'visible'); rows += tipRow(s.color, s.name, yFmt(v)); });
    showTip(`<b>${fmtDay(t)}</b>${rows}`, ev.clientX, ev.clientY);
  };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { hideTip(); cross.setAttribute('visibility', 'hidden'); dots.forEach((d) => d.setAttribute('visibility', 'hidden')); });
  node.appendChild(svg);
}

// ===================== views =====================
function delta(curV, base, { unit = '', dp = 0, higherBetter = true } = {}) {
  if (curV == null || base == null) return '<span class="flat">—</span>';
  const d = curV - base;
  if (Math.abs(d) < 10 ** -dp / 2) return '<span class="flat">normal</span>';
  const good = higherBetter ? d > 0 : d < 0;
  return `<span class="${good ? 'up-good' : 'down-bad'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(dp)}${unit}</span><span class="muted">30 gün ort.</span>`;
}

function recent(key, n) { const i = M.days.findIndex((d) => d.key === key); return M.days.slice(Math.max(0, i - n + 1), i + 1); }

          <div class="stages" id="stage-bar"></div>
          <div class="stage-list" id="stage-list"></div>
        </div>
      </div>
      <div class="stack">
        <div class="card"><div class="card-title"><h3>Son 14 gece</h3><span>performans %</span></div><div class="chart" id="sleep-bars"></div></div>
        <div class="card"><div class="card-title"><h3>İhtiyacın nasıl hesaplandı</h3></div>
          <p class="small muted" style="margin:0">Temel 7,5 saat · dünkü yüklenme 10'un üstündeyse her puan için +3 dk · son 3 gecenin uyku borcunun %30'u eklenir. Bu bizim tahminimiz, Garmin değeri değil.</p></div>
      </div>
    </div>`;
  $('#sleep-dial').appendChild(ring(130, day.sleepPerf, 100, css('--sleep'), { center: day.sleepPerf == null ? '–' : `${day.sleepPerf}%`, unit: 'PERFORMANS' }));
  const st = [['deep', 'Derin', '--deep'], ['light', 'Hafif', '--light'], ['rem', 'REM', '--rem'], ['awake', 'Uyanık', '--awake']];
  if (s) {
    const tot = sum(st.map(([k]) => s[k] || 0)) || 1;
    const bar = $('#stage-bar');
    for (const [k, l, c] of st) { if (!s[k]) continue; const seg = document.createElement('div'); seg.style.cssText = `flex:${s[k] / tot};background:var(${c})`; hover(seg, tipRow(css(c), l, `${fmtHours(s[k])} · %${Math.round((s[k] / tot) * 100)}`)); bar.appendChild(seg); }
    $('#stage-list').innerHTML = st.map(([k, l, c]) => `<div><i style="background:var(${c})"></i>${l}<b>${fmtHM(s[k] || 0)}</b></div>`).join('');
  } else { $('#stage-bar').hidden = true; $('#stage-list').innerHTML = '<div class="empty" style="grid-column:1/-1">Bu gece için uyku verisi yok.</div>'; }
  const nights = recent(cur, 14);
  bars($('#sleep-bars'), nights.map((d) => ({ key: d.key, label: fmtShort(d.t), value: d.sleepPerf, color: css('--sleep'), dim: d.key !== cur, selected: d.key === cur,
    tip: `<b>${fmtDay(d.t)}</b>${tipRow(css('--sleep'), 'Performans', d.sleepPerf != null ? `%${d.sleepPerf}` : '–')}${tipRow(null, 'Uyunan', d.asleep ? fmtHours(d.asleep) : '–')}${tipRow(null, 'İhtiyaç', fmtHours(d.sleepNeed))}` })),
  { max: 100, yTick: (x) => `${x}`, refs: [{ y: 85, label: '%85' }], onPick: (k) => { cur = k; render(); } });
}

  const day = M.byKey.get(cur);
  const zones = [0, 0, 0, 0, 0];
  for (const a of day.acts) (a.zones || []).forEach((z, i) => { zones[i] += z || 0; });
  const zt = sum(zones);
  v.innerHTML = `
    <div class="cols">
      <div class="stack">
        <div class="card">
          <div class="card-title"><h3>Günlük yüklenme</h3><span>${fmtDay(day.t)}</span></div>
          <div class="big-stat"><div class="dial" id="strain-dial"></div>
            <div class="facts">
              <div class="fact-line"><span>Antrenman yükü (Garmin)</span><b>${Math.round(day.load) || 0}</b></div>
              <div class="fact-line"><span>Adım</span><b>${day.d.steps ? day.d.steps.toLocaleString('tr') : '–'}</b></div>
              <div class="fact-line"><span>Yoğun dakika</span><b>${(day.d.imMod || 0) + 2 * (day.d.imVig || 0)}</b></div>
              <div class="fact-line"><span>Kalori (aktivite)</span><b>${Math.round(sum(day.acts.map((a) => a.cal))) || 0}</b></div>
            </div></div>
        </div>

      </div>
      <div class="stack">
        <div class="card"><div class="card-title"><h3>Son 14 gün</h3><span>yüklenme 0–21</span></div><div class="chart" id="strain-bars"></div></div>

  $('#strain-dial').appendChild(ring(130, day.strain, 21, css('--strain'), { center: (day.strain ?? 0).toFixed(1), unit: 'YÜKLENME' }));
  const zn = ['Bölge 1', 'Bölge 2', 'Bölge 3', 'Bölge 4', 'Bölge 5'];
  $('#zones').innerHTML = zt ? zones.map((z, i) => `<div class="zone-row"><span class="muted">${zn[i]}</span><div class="bar"><div style="width:${(z / Math.max(...zones)) * 100}%;background:var(--z${i + 1})"></div></div><span class="v">${fmtHours(z)}</span></div>`).join('') : '<div class="empty">Bu gün nabız bölgesi verisi yok.</div>';
  const d14 = recent(cur, 14);
  bars($('#strain-bars'), d14.map((d) => ({ key: d.key, label: fmtShort(d.t), value: d.strain, color: css('--strain'), dim: d.key !== cur, selected: d.key === cur,
    tip: `<b>${fmtDay(d.t)}</b>${tipRow(css('--strain'), 'Yüklenme', (d.strain ?? 0).toFixed(1))}${tipRow(null, 'Aktivite', d.acts.length)}${tipRow(null, 'Toparlanma', d.recovery != null ? `%${d.recovery}` : '–')}` })),
  { max: 21, yTick: String, onPick: (k) => { cur = k; render(); } });
  const runs = M.acts.filter(isRun), wk = weekStart(parseDay(cur));
  const weeks = []; for (let i = 9; i >= 0; i--) { const s0 = wk - i * 7 * DAY; const w = runs.filter((a) => a.t >= s0 && a.t < s0 + 7 * DAY); weeks.push({ s0, km: sum(w.map((a) => a.dist)) / 1000, n: w.length, dur: sum(w.map((a) => a.dur)) }); }
  bars($('#km-bars'), weeks.map((w, i) => ({ label: fmtShort(w.s0), value: round(w.km, 1), color: i === weeks.length - 1 ? css('--rec-green') : css('--surface-3'),
    tip: `<b>${fmtShort(w.s0)} haftası</b>${tipRow(null, 'Mesafe', `${w.km.toFixed(1)} km`)}${tipRow(null, 'Koşu', w.n)}${tipRow(null, 'Süre', fmtHours(w.dur))}${w.km ? tipRow(null, 'Ort. tempo', fmtPace(w.dur / w.km)) : ''}` })), { yTick: String });
}

function viewTrends(v) {
  v.innerHTML = `
    <div class="top" style="margin-top:-4px"><h2 class="num" style="margin:0;font-size:26px">Trendler</h2>
      <div class="seg" id="tseg"><button data-d="7">7G</button><button data-d="30">30G</button><button data-d="90">90G</button></div></div>
    <div class="cols">
      <div class="stack">
        <div class="card"><div class="card-title"><h3>Toparlanma</h3><span id="rec-avg"></span></div><div class="chart" id="t-rec"></div></div>
        <div class="card"><div class="card-title"><h3>HRV</h3><span>gece ortalaması, ms</span></div><div class="chart" id="t-hrv"></div></div>
        <div class="card"><div class="card-title"><h3>Dinlenik nabız</h3><span>bpm</span></div><div class="chart" id="t-rhr"></div></div>
      </div>

        <div class="card"><div class="card-title"><h3>Yüklenme</h3><span id="str-avg"></span></div><div class="chart" id="t-str"></div></div>

        <div class="card"><div class="card-title"><h3>Bu dönem</h3></div><div id="t-sum"></div></div>
      </div>
    </div>`;
  document.querySelectorAll('#tseg button').forEach((b) => { b.setAttribute('aria-pressed', String(Number(b.dataset.d) === trendDays)); b.addEventListener('click', () => { trendDays = Number(b.dataset.d); tryStore(() => localStorage.setItem('trendDays', String(trendDays))); render(); }); });
  const last = M.days[M.days.length - 1].key;
  const ds = recent(last, trendDays);
  const recs = ds.filter((d) => d.recovery != null);
  $('#rec-avg').textContent = recs.length ? `ort. %${Math.round(avg(recs.map((d) => d.recovery)))}` : '';
  bars($('#t-rec'), ds.map((d) => ({ key: d.key, label: fmtShort(d.t), value: d.recovery, color: recColor(d.recovery), tip: `<b>${fmtDay(d.t)}</b>${tipRow(recColor(d.recovery), 'Toparlanma', d.recovery != null ? `%${d.recovery}` : '–')}${tipRow(null, 'HRV', d.hrv?.last ? `${d.hrv.last} ms` : '–')}${tipRow(null, 'Dinlenik nabız', d.d.rhr ? `${d.d.rhr} bpm` : '–')}` })), { max: 100, onPick: (k) => { cur = k; go('today'); } });
  $('#str-avg').textContent = `ort. ${(avg(ds.map((d) => d.strain)) || 0).toFixed(1)}`;
  bars($('#t-str'), ds.map((d) => ({ key: d.key, label: fmtShort(d.t), value: d.strain, color: css('--strain'), tip: `<b>${fmtDay(d.t)}</b>${tipRow(css('--strain'), 'Yüklenme', (d.strain ?? 0).toFixed(1))}${tipRow(null, 'Aktivite', d.acts.length)}` })), { max: 21, onPick: (k) => { cur = k; go('strain'); } });
  const hv = ds.filter((d) => d.hrv?.last);
  line($('#t-hrv'), [{ name: 'HRV', color: css('--rec-green'), data: hv.map((d) => [d.t, d.hrv.last]), dots: trendDays > 7, faint: true }, { name: '30 gün ort.', color: css('--ink-2'), data: hv.filter((d) => d.hrvBase).map((d) => [d.t, round(d.hrvBase)]) }], { yFmt: (x) => `${x} ms` });
  const rh = ds.filter((d) => d.d.rhr);
  line($('#t-rhr'), [{ name: 'Dinlenik nabız', color: css('--rec-red'), data: rh.map((d) => [d.t, d.d.rhr]) }], { yFmt: (x) => `${x} bpm` });
  const sl = ds.filter((d) => d.asleep);
  bars($('#t-slp'), ds.map((d) => ({ label: fmtShort(d.t), value: d.asleep ? round(d.asleep / 3600, 2) : null, color: css('--sleep'), tip: `<b>${fmtDay(d.t)}</b>${tipRow(css('--sleep'), 'Uyunan', d.asleep ? fmtHours(d.asleep) : '–')}${tipRow(null, 'Performans', d.sleepPerf != null ? `%${d.sleepPerf}` : '–')}` })), { yTick: String, refs: [{ y: 7.5, label: '7,5 sa' }] });
  const greens = recs.filter((d) => d.recovery >= 67).length, reds = recs.filter((d) => d.recovery < 34).length;
  const runs = M.acts.filter((a) => isRun(a) && a.t >= ds[0].t);
  $('#t-sum').innerHTML = [
    ['Yeşil gün', `${greens} / ${recs.length}`], ['Kırmızı gün', `${reds}`], ['Ort. uyku', sl.length ? fmtHours(avg(sl.map((d) => d.asleep))) : '–'],
    ['Koşu', `${runs.length} · ${(sum(runs.map((a) => a.dist)) / 1000).toFixed(1)} km`],
  ].map(([k, val]) => `<div class="fact-line"><span>${k}</span><b>${val}</b></div>`).join('');
}

// ===================== demo data =====================
function demoData() {
  let seed = 11; const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const now = Date.now(), daily = {}, sleep = {}, hrv = {}, activities = [];
  const names = [['Kolay koşu', 0.75], ['Interval 6×800', 1.6], ['Tempo koşu', 1.3], ['Uzun koşu', 1.4], ['Toparlanma koşusu', 0.6]];
  let id = 1;
  for (let i = 120; i >= 0; i--) {
    const t = startOfDay(now - i * DAY), k = dayKey(t), prog = (120 - i) / 120, wave = Math.sin(i / 3.3);
    daily[k] = { steps: Math.round(5500 + r() * 9000), rhr: Math.round(57 - prog * 4 + r() * 4 - wave), stress: Math.round(22 + r() * 22), bbMax: Math.round(55 + r() * 45), bbMin: Math.round(5 + r() * 25), imMod: Math.round(r() * 40), imVig: Math.round(r() * 30), resp: 14 + r() * 1.6 };
    if (r() > 0.06) { const tot = (6.1 + r() * 2.1) * 3600; sleep[k] = { total: Math.round(tot), deep: Math.round(tot * (0.16 + r() * 0.06)), rem: Math.round(tot * (0.2 + r() * 0.05)), awake: Math.round(r() * 0.4 * 3600), score: Math.round(58 + r() * 34) }; sleep[k].light = Math.round(tot - sleep[k].deep - sleep[k].rem); }
    if (r() > 0.05) hrv[k] = { last: Math.round(46 + prog * 7 + r() * 14 + wave * 4), week: Math.round(49 + prog * 7), status: 'BALANCED', low: 42, high: 60 };
    if (r() < 0.5) {
      const [name, mult] = names[Math.floor(r() * names.length)];
      const dist = name === 'Uzun koşu' ? 10000 + r() * 4000 : name.startsWith('Interval') ? 7000 + r() * 1500 : 4000 + r() * 4000;
      const pace = 350 - prog * 22 + r() * 25 - (mult > 1.2 ? 20 : 0);
      const dur = (dist / 1000) * pace;
      const zones = mult > 1.2 ? [300, 900, 600, 700, 300] : [600, 1300, 300, 60, 0];
      activities.push({ id: id++, start: `${k} 07:${String(Math.floor(r() * 50) + 10)}:00`, type: 'running', name, dist, dur, moving: dur * 0.98, elev: 20 + r() * 80, avgHR: Math.round(138 + mult * 14 + r() * 8), maxHR: 175, cal: Math.round(dist / 1000 * 68), load: Math.round((50 + r() * 50) * mult * (dist / 6000)), aero: 2.6 + r() * 1.8, zones: zones.map((z) => z * (dur / 3000) * (0.7 + r() * 0.6)), vo2: Math.round(45 + prog * 3), f5k: dist >= 5000 ? pace * 5 * (mult > 1.2 ? 0.95 : 0.99) : null });
    }
    if (r() < 0.12) activities.push({ id: id++, start: `${k} 18:30:00`, type: 'strength_training', name: 'Kuvvet', dist: 0, dur: 2700, load: 35, zones: [900, 600, 120, 0, 0], cal: 260 });
  }
  return { summary: { activities: activities.length, days: 121, nights: Object.keys(sleep).length, lastSync: new Date().toISOString() }, activities, daily, sleep, hrv, fitnessAge: { fitnessAge: 29 } };
}

// ===================== boot =====================
const USER = { name: DEMO ? 'Demo Kullanıcı' : 'Recep', initial: DEMO ? 'D' : 'R' };

function start(data) {
  M = buildModel(data);
  if (!M.days.length) { $('#view').innerHTML = '<div class="card empty">Henüz veri yok. Klasik panodan "Refresh" ile Garmin verilerini çek.</div>'; return; }
  cur = M.days[M.days.length - 1].key;
  // If today has no sleep/HRV yet, start on today anyway; the recovery dial says "veri yok".
  $('#login').hidden = true; $('#app').hidden = false;
  $('#demo-pill').hidden = !DEMO;
  $('#avatar').textContent = USER.initial;
  render();
}

$('#prev-day').addEventListener('click', () => { const i = M.days.findIndex((d) => d.key === cur); if (i > 0) { cur = M.days[i - 1].key; render(); } });
$('#next-day').addEventListener('click', () => { const i = M.days.findIndex((d) => d.key === cur); if (i < M.days.length - 1) { cur = M.days[i + 1].key; render(); } });
$('#avatar').addEventListener('click', () => go('profile'));
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });

async function boot() {
  if (DEMO) return start(demoData());
  const res = await fetch('/api/data', { credentials: 'same-origin' });
  if (res.status === 401) { $('#login').hidden = false; $('#pw').focus(); return; }
  start(await res.json());
}
$('#login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
  if (!res.ok) { $('#login-err').textContent = 'Şifre yanlış.'; return; }
  boot();
});
boot();
</script>
